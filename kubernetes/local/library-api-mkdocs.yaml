---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api-mkdocs
  namespace: library-api
  labels:
    app: library-api-mkdocs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-api-mkdocs
  template:
    metadata:
      labels:
        app: library-api-mkdocs
    spec:
      containers:
      - name: library-api-mkdocs
        image: libraryapi-docs:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: library-api-mkdocs
  namespace: library-api
spec:
  selector:
    app: library-api-mkdocs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-api-mkdocs-ingress
  namespace: library-api
spec:
  ingressClassName: kong
  rules:
  - host: library-api-mkdocs.localhost.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: library-api-mkdocs
            port:
              number: 80
