{{- if .Values.ingressMkDocs.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "library-api.fullname" . }}-mkdocs
  labels:
    {{- include "library-api.labels" . | nindent 4 }}
  {{- with .Values.ingressMkDocs.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingressMkDocs.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingressMkDocs.tls }}
  tls:
    {{- range .Values.ingressMkDocs.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingressMkDocs.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "library-api.fullname" $ }}-mkdocs
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
